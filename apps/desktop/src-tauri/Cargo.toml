[package]
name = "marmotter-desktop"
description = "Marmotter desktop shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "marmotter_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
marmotter-transport = { path = "../../../crates/marmotter-transport" }
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
# The local log database. CLAUDE.md names this plugin for the job, so the
# schema and every query live in TypeScript where they can be tested, and Rust
# stays the thing that owns the file handle.
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
# Opening a link in the platform's browser. Worth a dependency rather than a
# hand-rolled subprocess: on Windows this is `ShellExecuteW`, the API the
# platform documents for the job, and the subprocess approaches all have a
# failure mode where the link lands somewhere other than the browser.
opener = { version = "0.8", default-features = false }
# Passwords, in the platform's own keychain — CLAUDE.md puts them there and
# nowhere else. Windows Credential Manager and the Secret Service on Linux; a
# machine with neither degrades to asking each time rather than to a file.
keyring = { version = "4", features = ["windows-native-keyring-store", "zbus-secret-service-keyring-store"] }
