/*
 * A throwaway Anope, for the second half of the Phase 6 acceptance run.
 *
 * Nothing here is tuned for a real network: registration is instant, e-mail is
 * off, and every throttle is relaxed, because the point is to exercise the
 * account and permissions panels rather than to run a service.
 */

define { name = "services.host"; value = "services.test.example"; }

uplink { host = "127.0.0.1"; ipv6 = no; ssl = no; port = 17001; password = "marmottertest"; }

serverinfo
{
	name = "services.test.example"
	description = "Marmotter Test Services"
	pid = "@ROOT@/e2e/anope/.run/services.pid"
	motd = "@ROOT@/e2e/anope/services.motd"
}

module { name = "inspircd3" }

networkinfo
{
	networkname = "MarmotterTest2"
	nicklen = 31
	userlen = 10
	hostlen = 64
	chanlen = 32
	modelistsize = 100
	vhost_chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-_/"
	allow_undotted_vhosts = true
	disallow_start_or_end = ".-_/"
}

options
{
	casemap = "rfc1459"
	seed = 0x27E1E5B2
	strictpasswords = no
	badpasslimit = 100
	useprivmsg = yes
	usestrictprivmsg = no
	regexengine = "regex_posix"
	nickchars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789[]{}^|`_-"
	readtimeout = 5m
	warningtimeout = 4h
	timeoutcheck = 3s
	useprivmsg = yes
	usestrictprivmsg = no
	retrywait = 60s
	hidestatso = no
	killonnickchange = no
	restrictopernicks = no
	newnickdelay = 0
	defaultmodes = "+nt"
	nickregdelay = 0
	usermodes = "+i"
	channelmodes = ""
}

log
{
	target = "services.log"
	bot = "Global"
	rawio = no
	debug = no
	normal = "*"
}

mail { usemail = no }

db_flatfile
{
	name = "db_flatfile"
	database = "@ROOT@/e2e/anope/.run/data/anope.db"
	keepbackups = 0
	nobackupokay = yes
}

/*
 * The service definitions, the command mappings, and the privilege table come
 * from the packaged configuration rather than being restated here. Anope's
 * commands are wired up in those files, and a hand-written subset silently
 * loses whichever ones it forgets — which is exactly the sort of thing this
 * run exists to catch, not to introduce.
 */
include { type = "file"; name = "modules.conf" }
include { type = "file"; name = "nickserv.conf" }
include { type = "file"; name = "chanserv.conf" }
include { type = "file"; name = "hostserv.conf" }
include { type = "file"; name = "operserv.conf" }
include { type = "file"; name = "global.conf" }

module { name = "enc_sha256" }
