# A throwaway InspIRCd for the Anope end-to-end run.
#
# Phase 6's acceptance asks for the panels to work against two different
# services packages. ergo's built-in services are one; this is the other, and
# it is a different ircd as well, which exercises the ISUPPORT-driven paths on
# a server that words everything differently.
<server name="irc.test.example" description="Marmotter Test" id="00A" network="MarmotterTest2">
<admin name="Test" nick="test" email="test@example.invalid">

<bind address="127.0.0.1" port="6668" type="clients">
<bind address="127.0.0.1" port="7001" type="servers">

<link name="services.test.example" ipaddr="127.0.0.1" port="7001" allowmask="127.0.0.0/8" sendpass="marmottertest" recvpass="marmottertest">
<uline server="services.test.example" silent="yes">

<power diepass="marmottertest" restartpass="marmottertest">

<connect allow="*" timeout="20" pingfreq="120" hardsendq="1M" softsendq="8192" recvq="8K" threshold="10" commandrate="1000" fakelag="off" localmax="1000" globalmax="1000" maxchans="100" limit="1000">

<class name="Admin" commandflags="*" privs="*" usermodes="*" chanmodes="*" snomasks="*">
<type name="NetAdmin" classes="Admin" host="netadmin.test">
<oper name="admin" password="marmottertest" hash="plaintext" host="*@*" type="NetAdmin">

<files motd="@ROOT@/e2e/anope/inspircd.motd">
<channels users="100" opers="200">
<pid file="@ROOT@/e2e/anope/.inspircd.pid">

<security hidewhois="" userstats="Pu" customversion="" hidesplits="no" hidebans="no" hidekills="" operspywhois="no" restrictbannedusers="yes" genericoper="no" maxtargets="20">

<limits maxnick="32" maxchan="64" maxmodes="20" maxident="11" maxquit="255" maxtopic="307" maxkick="255" maxreal="128" maxaway="200">

<log method="file" type="* -USERINPUT -USEROUTPUT" level="default" target="@ROOT@/e2e/anope/.inspircd.log">

<options prefixquit="Quit: " suffixquit="" prefixpart="&quot;" suffixpart="&quot;" syntaxhints="no" cyclehosts="yes" cyclehostsfromuser="no" ircumsgprefix="no" announcets="yes" allowmismatch="no" defaultbind="auto" hostintopic="yes" pingwarning="15" serverpingfreq="60" defaultmodes="not" moronbanner="You are banned." exemptchanops="" invitebypassmodes="yes" nosnoticestack="no">

<module name="spanningtree">
<module name="services_account">
<module name="hidechans">
<module name="customprefix">
<module name="banexception">
<module name="inviteexception">
<module name="sasl">
<sasl target="services.test.example">
<module name="cloaking">
<module name="sha256">
<module name="md5">
<customprefix name="halfop" letter="h" prefix="%" rank="20000" ranktoset="30000">
<customprefix name="admin" letter="a" prefix="&amp;" rank="40000" ranktoset="50000">
<customprefix name="founder" letter="q" prefix="~" rank="50000" ranktoset="50000">

<cloak mode="half" key="marmotter-test-cloak-key-not-a-secret-0123456789" prefix="test" ipalways="false">
