[package]
name = "marmotter-shell"
description = "Tauri commands shared by Marmotter's desktop and Android shells."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints.rust]
unsafe_code = "forbid"

[dependencies]
marmotter-transport = { path = "../marmotter-transport" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
