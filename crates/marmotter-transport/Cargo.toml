[package]
name = "marmotter-transport"
description = "TCP and TLS sockets for Marmotter. Moves bytes; does not parse IRC."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints.rust]
unsafe_code = "forbid"

[dependencies]
thiserror = "2"
# `fs` is the download's: it writes what arrives to a file. It was reaching the
# crate only through the dev-dependency below, so the library built in a test
# run and not on its own.
tokio = { version = "1", features = ["fs", "net", "io-util", "sync", "time", "rt", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
rustls-pemfile = "2"
rustls-native-certs = "0.8"
webpki-roots = "0.26"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
rcgen = "0.13"
tempfile = "3"
