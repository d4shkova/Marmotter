name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned, and shared by the cache key and the install. The Gradle plugin looks
  # for a linker at a path inside this NDK.
  NDK_VERSION: 27.2.12479018
  # Named once so the two jobs that install ergo cannot drift apart.
  ERGO_VERSION: 2.15.0

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify
        # One script, not five steps, so that what CI checks and what
        # `pnpm verify` checks cannot drift apart. They had: the steps here
        # ended with `pnpm build`, which compiles each package against its own
        # `tsconfig.build.json`, while the only thing run before a push was
        # `pnpm typecheck` against the root config — and the root config has
        # `DOM` in `lib` because the UI package needs it. A `window` in a
        # DOM-free package therefore passed everything locally and failed here.
        # `eslint.config.js` now catches that particular one at lint time; this
        # is what stops the next disagreement of the same shape.
        run: pnpm verify

      - name: Build Storybook
        # BUILD_PLAN phase 4 acceptance: Storybook builds and covers every
        # component. The axe checks themselves run in `pnpm coverage`, against
        # rendered components rather than against the built site.
        run: pnpm --filter @marmotter/ui build-storybook

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install the two servers
        # Phase 6's acceptance is about two services packages that disagree, so
        # both run: ergo's built-in services, and Anope on InspIRCd.
        #
        # The packages start daemons on install, and those are not the ones
        # under test — the suite runs its own with its own configuration. Only
        # the binaries are wanted here.
        run: |
          sudo apt-get update
          sudo apt-get install -y inspircd anope
          sudo systemctl disable --now inspircd anope || true
          # Debian ships Anope's configuration as root:irc 0640, and the suite
          # reads it as an ordinary user to build the service definitions from.
          sudo chmod a+r /etc/anope/*.conf
          # Both ship an AppArmor profile confining the daemon to the system
          # directories it was installed with — right for the daemon the
          # package runs, wrong for a throwaway server reading a generated
          # config out of the workspace. Unloading affects this runner only.
          sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.inspircd || true
          sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.anope || true

      - name: Install ergo
        # The acceptance criteria for phases 5 and 6 are about behaviour against
        # a real ircd, which is the one thing a unit test cannot stand in for.
        run: |
          .github/scripts/install-ergo.sh
          ergo initdb --conf e2e/ergo.yaml

      - name: Install Playwright's browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the packages and the web app
        run: pnpm -r --filter=./packages/* build && pnpm --filter @marmotter/web build

      - name: Run
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the Android frontend
        # `marmotter-android` has no `devUrl`, so `generate_context!` embeds
        # `apps/android/dist` and will not compile without it — not only for the
        # APK, but for `cargo check` and `cargo clippy` too. That is the
        # behaviour we want: a missing frontend should stop the build rather
        # than ship an app that asks a dev server for its interface.
        #
        # `apps/desktop` keeps its `devUrl` and needs no such step. Vite
        # resolves the workspace packages to source, so the app's own build is
        # all this needs.
        run: pnpm --filter @marmotter/android build

      - name: Install ergo
        # The transport integration tests connect to a real IRC server rather
        # than a mock, so one has to exist.
        run: |
          .github/scripts/install-ergo.sh
          ergo --version

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Cache the NDK
        # About a gigabyte, and it never changes for a pinned version. Without
        # this every push pays for the download again.
        id: ndk
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
          key: ndk-${{ runner.os }}-${{ env.NDK_VERSION }}

      - name: Install the SDK and NDK
        # Named explicitly rather than taken as "latest": the Gradle plugin
        # looks for a linker at a path inside the NDK, and a silently changing
        # one is a silently changing build.
        run: |
          if [ "${{ steps.ndk.outputs.cache-hit }}" != "true" ]; then
            sdkmanager --install "ndk;$NDK_VERSION"
          fi
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          # Its own cache: three Android targets share nothing with the host
          # build the `rust` job populates.
          key: android

      - run: pnpm install --frozen-lockfile

      - name: Build the Android frontend
        # Before cargo, not after: `generate_context!` embeds this into the Rust
        # library at compile time, so a missing `dist/` is a build that fails
        # rather than one that quietly ships a blank page.
        run: pnpm --filter @marmotter/android build

      - uses: gradle/actions/setup-gradle@v4
        with:
          # The standalone Gradle that generates the wrapper below. Pinned to
          # the version the wrapper itself names, because generating it runs a
          # Gradle command in that directory, which configures the build and
          # compiles buildSrc — under the runner's own Gradle 9 otherwise, which
          # neither AGP 8.7.3 nor this project supports.
          gradle-version: '8.11.1'

      - name: Generate the Gradle wrapper
        # The wrapper jar is a binary and is not committed. Keep the version in
        # step with gen/android/gradle/wrapper/gradle-wrapper.properties and
        # with the setup-gradle step above.
        working-directory: apps/android/src-tauri/gen/android
        run: gradle wrapper --gradle-version 8.11.1

      - name: Build the APK
        # Debug, which needs no keystore: Gradle generates one, and the result
        # installs on a device. Building it on every push is what stops the
        # Gradle project, the Kotlin, and the three Rust cross-builds from being
        # the only part of this repository nothing checks.
        working-directory: apps/android/src-tauri/gen/android
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: marmotter-android-apk
          path: apps/android/src-tauri/gen/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  relay:
    name: Relay
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          # No third-party dependencies yet, so there is no go.sum to key on.
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
