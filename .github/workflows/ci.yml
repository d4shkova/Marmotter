name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm coverage

      - name: Build
        run: pnpm build

      - name: Build Storybook
        # BUILD_PLAN phase 4 acceptance: Storybook builds and covers every
        # component. The axe checks themselves run in `pnpm coverage`, against
        # rendered components rather than against the built site.
        run: pnpm --filter @marmotter/ui build-storybook

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install ergo
        # The acceptance criteria for phases 5 and 6 are about behaviour against
        # a real ircd, which is the one thing a unit test cannot stand in for.
        run: |
          curl -sSL -o ergo.tar.gz \
            https://github.com/ergochat/ergo/releases/download/v2.15.0/ergo-2.15.0-linux-x86_64.tar.gz
          tar xzf ergo.tar.gz
          sudo install ergo-2.15.0-linux-x86_64/ergo /usr/local/bin/ergo
          ergo initdb --conf e2e/ergo.yaml

      - name: Install Playwright's browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the packages and the web app
        run: pnpm -r --filter=./packages/* build && pnpm --filter @marmotter/web build

      - name: Run
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install ergo
        # The transport integration tests connect to a real IRC server rather
        # than a mock, so one has to exist.
        run: |
          curl -sSL -o ergo.tar.gz \
            https://github.com/ergochat/ergo/releases/download/v2.15.0/ergo-2.15.0-linux-x86_64.tar.gz
          tar xzf ergo.tar.gz
          sudo install -m 755 ergo-2.15.0-linux-x86_64/ergo /usr/local/bin/ergo
          ergo --version

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  relay:
    name: Relay
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          # No third-party dependencies yet, so there is no go.sum to key on.
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
